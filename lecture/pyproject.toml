[project]
name = "lecture-study"
version = "0.1.0"
description = "Slide-aligned graduate lecture study materials on AgentCore"
requires-python = ">=3.12"
dependencies = ["bedrock-agentcore>=1.22.0", "boto3>=1.40", "pydantic>=2.8", "httpx>=0.27", "PyMuPDF>=1.26,<2", "python-pptx>=1.0,<2", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["media: integration tests requiring ffmpeg and ffprobe"]
